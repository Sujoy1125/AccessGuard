databases:
  - name: accessguard-db
    databaseName: accessguard
    user: accessguard_user
    plan: free

services:
  - type: web
    name: accessguard-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: accessguard-db
          property: connectionString
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
